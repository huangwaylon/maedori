<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="前撮り">
  <title>前撮り メモ</title>
  <link rel="preconnect" href="https://maedori-api.maedori-api.workers.dev" crossorigin>
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- every deploy: bump ?v= here, ASSET_V in app.js and version.json together (open apps update themselves) -->
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <header class="bar">
    <div class="titles">
      <h1>前撮り メモ <button id="offline" type="button" hidden></button></h1>
      <div class="sub">
        <button id="ver" type="button"></button>
        <p id="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="bar-actions">
      <button id="undo" type="button" aria-label="元に戻す" title="元に戻す (⌘Z)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>戻す</span>
      </button>
      <button id="redo" type="button" aria-label="やり直す" title="やり直す (⇧⌘Z)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>やり直す</span>
      </button>
      <button id="mode" type="button" aria-pressed="false">編集</button>
    </div>
  </header>
  <div id="update" role="status" hidden>
    <span>新しいバージョンがあります</span>
    <button type="button">更新</button>
  </div>
  <main id="sections"></main>
  <div id="empty" hidden>
    <p class="msg">読み込み中…</p>
    <button type="button" class="retry" hidden>もう一度読み込む</button>
  </div>

  <!-- edit mode: add photos / videos from the phone -->
  <button id="add" type="button" aria-label="写真・動画を追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>追加</span>
  </button>
  <input id="file" type="file" accept="image/*,video/*" multiple hidden>

  <dialog id="pass-dialog">
    <form method="dialog">
      <h3>パスコード</h3>
      <p class="hint">編集するにはパスコードを入力してください（この端末に保存されます）</p>
      <input type="password" autocomplete="current-password" enterkeyhint="done" aria-label="パスコード">
      <p class="error" aria-live="polite"></p>
      <div class="actions">
        <!-- primary first: Return/Done on the keyboard submits with the first button -->
        <button value="ok" class="primary">OK</button>
        <button value="cancel" formnovalidate>キャンセル</button>
      </div>
    </form>
  </dialog>

  <dialog id="upload-dialog">
    <form method="dialog">
      <h3><span class="what"></span>を追加</h3>
      <label>セクション
        <select></select>
      </label>
      <input type="text" placeholder="新しいセクション名" maxlength="40" aria-label="新しいセクション名" hidden>
      <div class="actions">
        <button value="ok" class="primary">アップロード</button>
        <button value="cancel" formnovalidate>キャンセル</button>
      </div>
    </form>
  </dialog>

  <script>
    window.MAEDORI_API = "https://maedori-api.maedori-api.workers.dev";
    // start loading the data now, in parallel with app.js (the first poll uses this; parsed JSON, read once)
    window.MAEDORI_FIRST = (() => {
      const c = new AbortController();
      setTimeout(() => c.abort(), 10000);
      const p = fetch(window.MAEDORI_API + "/api/data", { cache: "no-store", signal: c.signal })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))));
      p.catch(() => {}); // offline: app.js handles it
      return p;
    })();
  </script>
  <script src="app.js?v=20"></script>
</body>
</html>
